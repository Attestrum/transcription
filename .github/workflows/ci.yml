name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! requires the frontendDist dir to exist at
      # compile time; an empty one is sufficient for check/clippy/test.
      - run: mkdir -p build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: frontend (check, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  engine-tests:
    name: engine tests, real model (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TINY_SHA256: be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Cache whisper tiny model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: crates/core/tests/models/ggml-tiny.bin
          key: ggml-tiny-${{ env.TINY_SHA256 }}
      - name: Download whisper tiny model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p crates/core/tests/models
          curl -fsSL --retry 3 -o crates/core/tests/models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
      # Verified even on cache hit — a corrupted cache entry must not reach the test.
      - name: Verify model checksum
        shell: bash
        run: |
          f=crates/core/tests/models/ggml-tiny.bin
          actual=$( (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | awk '{print $1}' )
          [ "$actual" = "$TINY_SHA256" ] || { echo "checksum mismatch: $actual"; exit 1; }
      # The core crate is tauri-free by design — no frontendDist stub needed.
      # Scoped to engine:: — other ignored tests (live mic capture) need
      # hardware the runners don't have.
      - run: cargo test -p attestrum-transcription-core --lib engine:: -- --ignored

  build-smoke:
    name: build smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: npm ci
      - run: npm run tauri build -- --debug --no-bundle
