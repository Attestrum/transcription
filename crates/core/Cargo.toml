[package]
name = "attestrum-transcription-core"
description = "Core engine for Attestrum Transcription: audio capture and decoding, Whisper inference, transcript storage, export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fs4 = "0.13"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
symphonia = { version = "0.6.0", features = ["mp3", "aac", "alac", "isomp4"] }
rubato = "3.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
hound = "3"
tiny_http = "0.12"
